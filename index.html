<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>英语单词小达人 - 三年级上册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#4a90d9;--success:#52c41a;--warning:#faad14;--danger:#ff4d4f;--bg:#f0f5ff;--card:#fff;--text:#333;--radius:12px;--shadow:0 4px 12px rgba(0,0,0,.1)}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.app{max-width:900px;margin:0 auto;padding:16px}
.header{text-align:center;padding:20px 0;background:linear-gradient(135deg,#4a90d9,#7b68ee);color:#fff;border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow)}
.header h1{font-size:1.5rem;margin-bottom:4px}
.header p{font-size:.85rem;opacity:.9}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{flex:1;min-width:70px;padding:10px 8px;text-align:center;background:var(--card);border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;color:var(--text);box-shadow:var(--shadow);transition:all .2s}
.tab.active{background:var(--primary);color:#fff}
.tab:active{transform:scale(.95)}
.view{display:none;animation:fadeIn .3s}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card-box{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.stat-item{background:var(--card);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat-item .num{font-size:1.8rem;font-weight:bold;color:var(--primary)}
.stat-item .label{font-size:.8rem;color:#888;margin-top:4px}
.stat-item .num.success{color:var(--success)}
.stat-item .num.warning{color:var(--warning)}
.stat-item .num.danger{color:var(--danger)}
.progress-bar{width:100%;height:12px;background:#e0e0e0;border-radius:6px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,#52c41a,#73d13d);border-radius:6px;transition:width .5s}
.day-badge{display:inline-block;background:var(--primary);color:#fff;padding:4px 12px;border-radius:20px;font-size:.8rem;margin-bottom:12px}
.word-list{display:flex;flex-wrap:wrap;gap:8px}
.word-tag{background:#e6f7ff;border:1px solid #91d5ff;border-radius:6px;padding:4px 10px;font-size:.85rem;cursor:pointer;transition:all .2s}
.word-tag:hover{background:#bae7ff}
.word-tag.learned{background:#f6ffed;border-color:#b7eb8f;color:#52c41a}
.word-tag.mastered{background:#f6ffed;border-color:#52c41a;color:#389e0f;font-weight:bold}
.word-tag.wrong{background:#fff1f0;border-color:#ffa39e;color:#ff4d4f}
/* Flashcard */
.flashcard-container{perspective:1000px;margin:0 auto 20px;max-width:500px}
.flashcard{width:100%;height:280px;position:relative;transform-style:preserve-3d;transition:transform .6s;cursor:pointer}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-shadow:var(--shadow)}
.flashcard-front{background:linear-gradient(135deg,#4a90d9,#7b68ee);color:#fff}
.flashcard-back{background:linear-gradient(135deg,#52c41a,#389e0c);color:#fff;transform:rotateY(180deg)}
.flashcard .word{font-size:2.2rem;font-weight:bold;margin-bottom:8px}
.flashcard .phonetic{font-size:1.1rem;opacity:.9;margin-bottom:12px}
.flashcard .meaning{font-size:1.4rem;font-weight:bold;margin-bottom:8px}
.flashcard .example{font-size:.9rem;opacity:.85;text-align:center;margin-top:8px;line-height:1.5}
.flashcard .unit-tag{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px;font-size:.75rem}
.flashcard .hint{font-size:.8rem;opacity:.7;margin-top:16px}
.btn{padding:10px 24px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.95rem;transition:all .2s}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}
.btn-large{padding:14px 32px;font-size:1.1rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.controls{display:flex;justify-content:center;gap:12px;margin-top:16px}
/* Practice */
.practice-box{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);text-align:center}
.practice-box .prompt{font-size:1.6rem;font-weight:bold;margin-bottom:8px;color:var(--primary)}
.practice-box .phonetic-hint{font-size:1rem;color:#888;margin-bottom:16px}
.practice-box input{width:100%;max-width:300px;padding:12px 16px;font-size:1.2rem;border:2px solid #d9d9d9;border-radius:var(--radius);text-align:center;outline:none;margin-bottom:16px}
.practice-box input:focus{border-color:var(--primary)}
.practice-box input.correct{border-color:var(--success);background:#f6ffed}
.practice-box input.wrong{border-color:var(--danger);background:#fff1f0}
.feedback{margin:12px 0;padding:12px;border-radius:var(--radius);font-size:.95rem;display:none}
.feedback.show{display:block}
.feedback.success{background:#f6ffed;color:#389e0c}
.feedback.error{background:#fff1f0;color:#cf1322}
/* Quiz */
.quiz-question{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.quiz-question .question-text{font-size:1.4rem;font-weight:bold;margin-bottom:20px;text-align:center}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quiz-option{padding:14px;border:2px solid #d9d9de;border-radius:var(--radius);cursor:pointer;text-align:center;font-size:1rem;transition:all .2s;background:#fff}
.quiz-option:hover{border-color:var(--primary);background:#e6f7ff}
.quiz-option.selected{border-color:var(--primary);background:#e6f7ff}
.quiz-option.correct{border-color:var(--success);background:#f6ffed;color:#389e0c}
.quiz-option.wrong{border-color:var(--danger);background:#fff1f0;color:#cf1322}
.quiz-option:active{transform:scale(.98)}
.quiz-single{grid-template-columns:1fr}
/* Exam */
.exam-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.exam-timer{background:var(--card);padding:8px 16px;border-radius:var(--radius);font-size:1rem;font-weight:bold;box-shadow:var(--shadow)}
.exam-score{background:var(--card);padding:8px 16px;border-radius:var(--radius);font-size:1rem;font-weight:bold;box-shadow:var(--shadow)}
.exam-result{text-align:center;padding:40px 20px}
.exam-result .score-circle{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:2.5rem;font-weight:bold;color:#fff}
.exam-result .score-circle.excellent{background:linear-gradient(135deg,#52c41a,#389e0c)}
.exam-result .score-circle.good{background:linear-gradient(135deg,#4a90d9,#2c7ead)}
.exam-result .score-circle.pass{background:linear-gradient(135deg,#faad14,#d48806)}
.exam-result .score-circle.fail{background:linear-gradient(135deg,#ff4d4f,#cf1322)}
/* Progress */
.unit-progress{margin-bottom:12px}
.unit-progress .unit-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.unit-progress .unit-name{font-weight:bold;font-size:.9rem}
.unit-progress .unit-stats{font-size:.8rem;color:#888}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.calendar-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.7rem;cursor:pointer;transition:all .2s}
.calendar-cell.empty{background:transparent}
.calendar-cell.future{background:#f0f0f0;color:#ccc}
.calendar-cell.today{background:var(--warning);color:#fff;font-weight:bold;box-shadow:0 0 8px rgba(250,173,20,.5)}
.calendar-cell.done{background:var(--success);color:#fff}
.calendar-cell.missed{background:var(--danger);color:#fff;opacity:.5}
.calendar-legend{display:flex;gap:12px;font-size:.75rem;color:#888;justify-content:center;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-color{width:12px;height:12px;border-radius:3px}
.empty-state{text-align:center;padding:40px 20px;color:#999}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px;margin-top:16px}
.badge{text-align:center;padding:12px 8px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
.badge .badge-icon{font-size:2rem}
.badge .badge-name{font-size:.7rem;margin-top:4px;color:#888}
.badge.locked{opacity:.4;filter:grayscale(1)}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:1px solid #d9d9de;border-radius:20px;cursor:pointer;font-size:.8rem;background:#fff;transition:all .2s}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:9999;animation:confetti-fall 3s ease-out forwards}
@keyframes confetti-fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,.1);display:flex;z-index:100}
.bottom-nav .tab{flex:1;padding:12px 4px;border:none;background:none;font-size:.75rem;cursor:pointer;color:#888;transition:all .2s}
.bottom-nav .tab.active{color:var(--primary)}
.bottom-nav .tab-icon{font-size:1.2rem;display:block;margin-bottom:2px}
.bottom-nav .tab:active{transform:scale(.95)}
@media(max-width:600px){.quiz-options{grid-template-columns:1fr}.flashcard{height:240px}.flashcard .word{font-size:1.8rem}.stat-grid{grid-template-columns:repeat(2,1fr)}}
.speak-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer;transition:all .2s;margin-top:8px}
.speak-btn:active{transform:scale(.9)}
.mode-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mode-card{background:var(--card);border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.mode-card:active{transform:scale(.97)}
.mode-card .mode-icon{font-size:2.5rem;margin-bottom:8px}
.mode-card .mode-title{font-size:1rem;font-weight:bold;margin-bottom:4px}
.mode-card .mode-desc{font-size:.75rem;color:#888}
.mode-card.learn{border-top:4px solid #4a90d9}
.mode-card.practice{border-top:4px solid #52c41a}
.mode-card.quiz{border-top:4px solid #faad14}
.mode-card.exam{border-top:4px solid #ff4d4f}
.mode-card.progress{border-top:4px solid #7b68ee}
.mode-card.wrong{border-top:4px solid #ff7a45}
.result-stars{text-align:center;font-size:1.8rem;margin:12px 0}
.qtype-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;margin-bottom:8px}
.qtype-badge.choice{background:#e6f7ff;color:#1890ff}
.qtype-badge.spell{background:#f6ffed;color:#52c41a}
.qtype-badge.match{background:#fff7e6;color:#faad14}
.recording-section{background:#fff3cd;border:2px solid #ffc107;border-radius:var(--radius);padding:16px;margin-top:16px}
.recording-section h3{color:#f57c00;margin-bottom:8px}
.record-btn{background:#ff4d4f;color:#fff;border:none;border-radius:50%;width:64px;height:64px;font-size:1.8rem;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(255,77,79,.4)}
.record-btn:hover{transform:scale(1.1)}
.record-btn.recording{background:#f5222d;animation:pulse-rec 1s infinite}
@keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(255,77,79,.4)}50%{box-shadow:0 0 0 12px rgba(255,77,79,0)}}
.recording-indicator{display:none;align-items:center;gap:8px;justify-content:center;margin:8px 0}
.recording-indicator.show{display:flex}
.recording-dot{width:10px;height:10px;border-radius:50%;background:#ff4d4f;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.recording-timer{font-size:.9rem;color:#ff4d4f;font-weight:bold}
.recording-result{text-align:center;margin:12px 0}
.recording-result audio{width:100%;max-width:300px;margin:8px 0}
.recording-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.star-rating{font-size:1.8rem;text-align:center;margin:8px 0}
.star-rating .star{display:inline-block;padding:0 2px}
.star-rating .star.active{color:#faad14}
.star-rating .star.inactive{color:#e0e0e0}
.recognition-result{font-size:.9rem;padding:8px;border-radius:8px;margin:8px auto;max-width:300px;text-align:center}
.recognition-result.match{background:#f6ffed;color:#389e0c}
.recognition-result.nomatch{background:#fff1f0;color:#cf1322}
.recognition-result.notsupport{background:#f5f5f5;color:#999}
.recording-history{margin-top:12px;border-top:1px dashed #ddd;padding-top:8px}
.recording-history h4{font-size:.85rem;margin-bottom:6px;color:#888}
.recording-history-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:.8rem;border-bottom:1px dashed #eee}
.recording-history-item:last-child{border-bottom:none}
.rec-history-score{color:#faad14}
.rec-history-date{color:#bbb}
.rec-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:12px 0}
.rec-stat-item{background:#f5f5f5;border-radius:8px;padding:8px;text-align:center}
.rec-stat-item .num{font-size:1.4rem;font-weight:bold;color:#faad14}
.rec-stat-item .label{font-size:.7rem;color:#888;margin-top:2px}
.backup-card{background:linear-gradient(135deg,#e3f2fd,#f3e5f5);border:2px solid #7b68ee;border-radius:var(--radius);padding:16px;margin-top:16px}
.backup-card h3{color:#7b68ee;margin-bottom:8px}
.backup-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.backup-info{font-size:.75rem;color:#888;margin-top:8px;line-height:1.5}
.import-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000}
.import-modal.show{display:flex}
.import-modal-content{background:#fff;border-radius:var(--radius);padding:24px;max-width:400px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.import-modal-content h3{margin-bottom:12px}
.import-modal-content p{color:#666;font-size:.9rem;margin-bottom:16px;line-height:1.5}
.import-modal-content .modal-btns{display:flex;gap:10px;justify-content:center;margin-top:16px}
.import-stats{background:#f5f5f5;border-radius:8px;padding:12px;margin:12px 0;text-align:left;font-size:.85rem}
.import-stats .stat-row{display:flex;justify-content:space-between;padding:2px 0}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1>🌟 英语单词小达人</h1>
<p>广州（新）三年级上册 · 53天背词计划</p>
</div>
<div id="float-sync" style="position:fixed;bottom:70px;right:12px;background:rgba(255,255,255,.95);border-radius:20px;padding:4px 12px;font-size:.72rem;color:#bbb;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:500;transition:opacity .3s;pointer-events:none"></div>
<div class="tabs">
<button class="tab active" onclick="showView('dashboard')">首页</button>
<button class="tab" onclick="showView('learn')">学单词</button>
<button class="tab" onclick="showView('practice')">练拼写</button>
<button class="tab" onclick="showView('quiz')">选择题</button>
<button class="tab" onclick="showView('exam')">考试</button>
<button class="tab" onclick="showView('progress')">进度</button>
<button class="tab" onclick="showView('wrong')">错题本</button>
</div>
<div id="view-dashboard" class="view active"></div>
<div id="view-learn" class="view"></div>
<div id="view-practice" class="view"></div>
<div id="view-quiz" class="view"></div>
<div id="view-exam" class="view"></div>
<div id="view-progress" class="view"></div>
<div id="view-wrong" class="view"></div>
</div>
<div class="bottom-nav">
<button class="tab" onclick="showView('dashboard')"><span class="tab-icon">🏠</span>首页</button>
<button class="tab" onclick="showView('learn')"><span class="tab-icon">📖</span>学习</button>
<button class="tab" onclick="showView('practice')"><span class="tab-icon">✏️</span>拼写</button>
<button class="tab" onclick="showView('quiz')"><span class="tab-icon">📝</span>测验</button>
<button class="tab" onclick="showView('exam')"><span class="tab-icon">🏆</span>考试</button>
<button class="tab" onclick="showView('progress')"><span class="tab-icon">📊</span>进度</button>
<button class="tab" onclick="showView('wrong')"><span class="tab-icon">❌</span>错题</button>
</div>
<input type="file" id="import-file-input" accept=".json" style="display:none" onchange="handleFileImport(event)">
<div class="import-modal" id="import-modal">
<div class="import-modal-content">
<h3>📥 导入学习进度</h3>
<p id="import-confirm-text">确认导入以下学习进度数据？</p>
<div class="import-stats" id="import-stats"></div>
<div class="modal-btns">
<button class="btn btn-outline" onclick="closeImportModal()">取消</button>
<button class="btn btn-primary" onclick="confirmImport()">确认导入</button>
</div>
</div>
</div>
<div class="import-modal" id="sync-modal">
<div class="import-modal-content" style="max-width:420px;text-align:left">
<h3 style="text-align:center">☁️ GitHub 云同步设置</h3>
<div style="margin-bottom:12px">
<label style="font-size:.85rem;display:block;margin-bottom:4px">GitHub 用户名</label>
<input type="text" id="gh-username" placeholder="如 kevinxuk" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:.9rem">
</div>
<div style="margin-bottom:12px">
<label style="font-size:.85rem;display:block;margin-bottom:4px">仓库名</label>
<input type="text" id="gh-repo" placeholder="如 english-words-kid" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:.9rem">
</div>
<div style="margin-bottom:12px">
<label style="font-size:.85rem;display:block;margin-bottom:4px">分支名</label>
<input type="text" id="gh-branch" placeholder="master" value="master" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:.9rem">
</div>
<div style="margin-bottom:12px">
<label style="font-size:.85rem;display:block;margin-bottom:4px">Personal Access Token</label>
<input type="password" id="gh-token" placeholder="ghp_xxxx（需要repo权限）" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:.9rem">
<p style="font-size:.75rem;color:#999;margin-top:4px">在 github.com/settings/tokens 创建，需勾选 repo 权限。Token 仅保存在本机浏览器。</p>
</div>
<div style="margin-bottom:16px">
<label style="font-size:.85rem;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="gh-autosync" style="width:auto">自动同步（每次答题后自动上传）</label>
</div>
<div id="sync-status" style="text-align:center;font-size:.85rem;margin-bottom:12px;min-height:20px"></div>
<div class="modal-btns" style="flex-wrap:wrap">
<button class="btn btn-outline" onclick="closeSyncModal()">关闭</button>
<button class="btn btn-outline" onclick="saveSyncConfig()">💾 保存设置</button>
<button class="btn btn-primary" onclick="syncToGitHub()">⬆️ 上传进度</button>
<button class="btn btn-success" onclick="syncFromGitHub()">⬇️ 下载进度</button>
</div>
</div>
</div>
<script>
// ============= 词汇数据 =============
const VOCAB = [
// Unit 1 - Day 1-3
{w:"me",p:"/miː/",m:"我（宾格）",u:1,d:1,e:"Show me, please.",ez:"请给我看看。"},
{w:"it",p:"/ɪt/",m:"它",u:1,d:1,e:"It's on this ruler.",ez:"它在这把尺子上。"},
{w:"be",p:"/biː/",m:"是（am/is/are）",u:1,d:1,e:"I want to be a driver.",ez:"我想成为一名司机。"},
{w:"on",p:"/ɒn/",m:"在...上面",u:1,d:1,e:"It's on this ruler.",ez:"它在这把尺子上。"},
{w:"this",p:"/ðɪs/",m:"这，这个",u:1,d:1,e:"This is 1A.",ez:"这是一年级A班。"},
{w:"ruler",p:"/ˈruːlər/",m:"尺子",u:1,d:2,e:"It's on this ruler.",ez:"它在这把尺子上。"},

const STORAGE_KEY='word_master_data';
function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return{}}}
function saveData(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}catch(e){}}
let state=loadData();
if(!state.learned)state.learned={};if(!state.mastered)state.mastered={};
if(!state.wrong)state.wrong={};if(!state.stats)state.stats={totalAnswered:0,correct:0,daysStudied:[]};
if(!state.dayProgress)state.dayProgress={};
if(!state.recordingScores)state.recordingScores={};
if(!state.masteredCount)state.masteredCount={};
if(!state.firstMasteredDate)state.firstMasteredDate={};
if(!state.retired)state.retired={};
if(!state.todayCorrect)state.todayCorrect={};
if(!state.lastReviewed)state.lastReviewed={};
if(!state.modeStats)state.modeStats={learn:{total:0,correct:0},practice:{total:0,correct:0},quiz:{total:0,correct:0}};
// Migrate old data: give existing mastered words a head start
Object.keys(state.mastered).forEach(w=>{
if(!state.masteredCount[w]){state.masteredCount[w]=1;state.firstMasteredDate[w]=new Date().toISOString()}
});
// Safety: if retired count >= learned count, the retirement mechanism may have been too aggressive
// Auto-reset to prevent empty learn pool
const learnedCount=Object.keys(state.learned||{}).length;
const retiredCount=Object.keys(state.retired||{}).length;
if(learnedCount>0 && retiredCount>=learnedCount){
state.retired={};
}
// Migrate firstMasteredDate to lastReviewed for existing data
Object.keys(state.firstMasteredDate||{}).forEach(w=>{
if(!state.lastReviewed[w])state.lastReviewed[w]=state.firstMasteredDate[w];
});
// Cleanup old todayCorrect entries (keep last 2 days)
(function(){const now=Date.now();Object.keys(state.todayCorrect||{}).forEach(k=>{const parts=k.split('-');if(parts.length>=3){const d=new Date(parts[0],parts[1]-1,parts[2]);if((now-d.getTime())/86400000>2)delete state.todayCorrect[k]}})})();
function save(){saveData(state);scheduleAutoSync();scheduleCloudSync()}
function getTodayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function getPlanDay(){
const start=new Date(2026,6,4);
const today=new Date();today.setHours(0,0,0,0);start.setHours(0,0,0,0);
const diff=Math.floor((today-start)/(86400000))+1;
return diff>0&&diff<=53?diff:diff<=0?1:53;
}
function seededRandom(seed){let s=seed;return function(){s=(s*9301+49297)%233280;return s/233280}}
function seededShuffle(arr,seed){const rng=seededRandom(seed);const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getNewWords(day){
const today=getTodayStr();
// 1. 优先取当前天数之后的未学单词（毕业词不再作为新词，只在复习中巩固）
let newWords=VOCAB.filter(v=>v.d>=day&&!state.learned[v.w]);
// 2. 兜底：取所有未学单词
if(newWords.length===0){
newWords=VOCAB.filter(v=>!state.learned[v.w]);
}
// 3. 限制每日新词最多5个
let result=seededShuffle(newWords,day*11+7);
if(result.length>5)result=result.slice(0,5);
// 4. 如果新词不足5个，用复习词填补（复习词包含退休巩固词）
let fillCount=5-result.length;
if(fillCount>0){
let reviewWords=getReviewWords(day);
let existing=result.map(w=>w.w);
let extra=reviewWords.filter(w=>!existing.includes(w.w)).slice(0,fillCount);
result=result.concat(extra);
}
return result;
}
function getReviewWords(day){
const today=getTodayStr();
// 1. 候选池：所有已学单词（包含已退休的毕业词，作为巩固复习）
let candidates=VOCAB.filter(v=>state.learned[v.w]);
if(candidates.length===0)return[];
// 2. 遗忘曲线：根据状态决定复习间隔
function getReviewInterval(w){
const mc=state.masteredCount[w.w]||0;
const isRetired=!!state.retired[w.w];
if(state.wrong[w.w])return 1; // 错题词：1天
if(isRetired)return 14; // 已退休毕业词：14天巩固一次
if(mc<=1)return 1; // 掌握1次：1天
if(mc===2)return 3; // 掌握2次：3天
return 7; // 掌握3次+：7天
}
function daysSinceLastReview(w){
const lr=state.lastReviewed[w.w];
if(!lr)return 999;
return Math.floor((Date.now()-new Date(lr))/86400000);
}
// 3. 按遗忘曲线筛选到期词
let dueWords=candidates.filter(v=>daysSinceLastReview(v)>=getReviewInterval(v));
// 4. 错题词不受间隔限制，始终优先
let wrongWords=candidates.filter(v=>state.wrong[v.w]);
let reviewPool=wrongWords.length>0?wrongWords:dueWords;
// 5. 已答对的今日词排后
let seenToday=reviewPool.filter(v=>state.todayCorrect[today+'-'+v.w]);
let notSeenToday=reviewPool.filter(v=>!state.todayCorrect[today+'-'+v.w]);
// 6. wrong 词始终优先，未错词按掌握次数升序
let wWrong=notSeenToday.filter(v=>state.wrong[v.w]);
let wNotWrong=notSeenToday.filter(v=>!state.wrong[v.w]);
wNotWrong.sort((a,b)=>(state.masteredCount[a.w]||0)-(state.masteredCount[b.w]||0));
let ordered=seededShuffle(wWrong,day*3+1).concat(seededShuffle(wNotWrong,day*7+13));
// 今日已答对词排在后面
let sWrong=seenToday.filter(v=>state.wrong[v.w]);
let sNotWrong=seenToday.filter(v=>!state.wrong[v.w]);
sNotWrong.sort((a,b)=>(state.masteredCount[a.w]||0)-(state.masteredCount[b.w]||0));
ordered=ordered.concat(seededShuffle(sWrong,day*5+3),seededShuffle(sNotWrong,day*9+17));
// 7. 每日数量上限
let count=day<=38?20:day<=45?15:5;
if(ordered.length<=count)return ordered;
// 8. 按天轮转，每天看到不同的子集
let offset=(day*3)%ordered.length;
let result=[];
for(let i=0;i<count;i++){result.push(ordered[(offset+i)%ordered.length])}
return result;
}
function checkRetiredStatus(){
const now=new Date();
let changed=false;
// Un-retire words that are currently in wrong state — they are not continuously mastered
Object.keys(state.retired||{}).forEach(word=>{
if(state.wrong[word]){delete state.retired[word];changed=true}
});
// Compute shouldRetire for each mastered word, then apply once (no oscillation)
// 退休条件：掌握后连续2天未答错（通过 firstMasteredDate 判断）
Object.keys(state.mastered).forEach(word=>{
const first=state.firstMasteredDate[word];
const isRetired=!!state.retired[word];
let shouldRetire=false;
if(first&&state.mastered[word]&&!state.wrong[word]){
const days=(now-new Date(first))/86400000;
if(days>=2)shouldRetire=true
}
if(shouldRetire&&!isRetired){state.retired[word]=true;changed=true}
else if(!shouldRetire&&isRetired){delete state.retired[word];changed=true}
});
// Clean up orphaned retired entries (retired but not mastered — from sync bugs or old data)
Object.keys(state.retired||{}).forEach(word=>{
if(!state.mastered[word]){delete state.retired[word];changed=true}
});
if(changed)save()
}

function levenshtein(a,b){a=a.toLowerCase();b=b.toLowerCase();const m=a.length,n=b.length;const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:Math.min(dp[i-1][j-1]+1,dp[i][j-1]+1,dp[i-1][j]+1);return dp[m][n]}
function autoScoreFromRecognition(targetWord,recognizedText){
const target=targetWord.replace(/[^a-zA-Z ]/g,'').trim().toLowerCase();
const recognized=(recognizedText||'').trim().toLowerCase();
if(!recognized)return{score:1,match:false,reason:'未识别到语音'};
if(recognized===target)return{score:5,match:true,reason:'完美匹配！'};
if(recognized.includes(target))return{score:5,match:true,reason:'完美匹配！'};
const firstWord=recognized.split(/\s+/)[0];
const dist=levenshtein(target,firstWord);
const maxLen=Math.max(target.length,firstWord.length);
const similarity=maxLen>0?1-dist/maxLen:0;
if(similarity>=0.8)return{score:4,match:true,reason:'发音接近，很棒！'};
if(similarity>=0.6)return{score:3,match:false,reason:'发音相似，继续练习'};
if(similarity>=0.3)return{score:2,match:false,reason:'发音偏差较大'};
return{score:1,match:false,reason:'发音不匹配'}
}
async function analyzeAudioBlob(blob){
return new Promise((resolve)=>{const reader=new FileReader();reader.onload=async()=>{try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const audioBuffer=await ctx.decodeAudioData(reader.result);const data=audioBuffer.getChannelData(0);let sum=0,max=0,samples=0;for(let i=0;i<data.length;i+=Math.floor(data.length/1000)||1){const v=Math.abs(data[i]);sum+=v;if(v>max)max=v;samples++}const avg=samples>0?sum/samples:0;ctx.close();resolve({duration:audioBuffer.duration,volume:avg,maxVolume:max})}catch(e){resolve({duration:0,volume:0,maxVolume:0})}};reader.onerror=()=>resolve({duration:0,volume:0,maxVolume:0});reader.readAsArrayBuffer(blob)})
}
function autoScoreFromAudio(audioData){
const {duration,volume,maxVolume}=audioData;
if(duration<0.3||maxVolume<0.01)return{score:1,match:false,reason:'录音太短或声音太小'};
if(duration<0.5)return{score:2,match:false,reason:'朗读时间偏短'};
if(maxVolume<0.05)return{score:2,match:false,reason:'声音偏小'};
if(duration>=0.5&&duration<=4&&maxVolume>=0.1)return{score:4,match:null,reason:'录音完整清晰'};
if(duration>4)return{score:3,match:null,reason:'朗读时间偏长'};
return{score:3,match:null,reason:'录音完成'}
}

function flipCard(){learnFlipped=!learnFlipped;const c=document.getElementById('flashcard');if(c)c.classList.toggle('flipped')}
function markKnown(){
if(learnWords[learnIdx]){
const w=learnWords[learnIdx].w;
state.learned[w]=true;state.mastered[w]=true;delete state.wrong[w];
state.masteredCount[w]=(state.masteredCount[w]||0)+1;
if(!state.firstMasteredDate[w])state.firstMasteredDate[w]=new Date().toISOString();
// 退休由 checkRetiredStatus() 根据时间条件统一判断，不在此处立即退休
state.todayCorrect[getTodayStr()+'-'+w]=true;
state.lastReviewed[w]=new Date().toISOString();
state.modeStats.learn.total=(state.modeStats.learn.total||0)+1;
state.modeStats.learn.correct=(state.modeStats.learn.correct||0)+1;
save()}
nextCard()}
function markWrong(){
if(learnWords[learnIdx]){
const w=learnWords[learnIdx].w;
state.learned[w]=true;state.wrong[w]=true;delete state.mastered[w];
state.masteredCount[w]=0;delete state.firstMasteredDate[w];delete state.retired[w];
delete state.todayCorrect[getTodayStr()+'-'+w];
state.lastReviewed[w]=new Date().toISOString();
state.modeStats.learn.total=(state.modeStats.learn.total||0)+1;
save()}
nextCard()}
function nextCard(){learnIdx++;if(learnIdx>=learnWords.length){learnWords=[];showConfetti();document.getElementById('view-learn').innerHTML='<div class="empty-state"><div class="icon">🎉</div><h3>太棒了！</h3><p>本组单词学习完成！</p><div class="controls" style="margin-top:20px"><button class="btn btn-primary" onclick="learnIdx=0;renderLearn()">再学一遍</button><button class="btn btn-outline" onclick="showView(\'dashboard\')">返回首页</button></div></div>'}else{renderLearnCard()}}
// Practice mode
let practiceWord=null;
function renderPractice(){
// Only use words the child has already learned in learn mode (including retired words for review)
const candidates=VOCAB.filter(v=>state.learned[v.w]&&!v.w.includes('...')&&!v.w.includes('/'));
if(candidates.length===0){document.getElementById('view-practice').innerHTML='<div class="empty-state"><div class="icon">📭</div><p>暂无可练习的单词</p><p style="color:#999;font-size:.85rem;margin-top:8px">请先在「学单词」中学习一些单词</p><div class="controls" style="margin-top:16px"><button class="btn btn-primary" onclick="showView(\'learn\')">去学单词</button></div></div>';return}
// Prioritize wrong words, then least-mastered words
let wrong=candidates.filter(v=>state.wrong[v.w]);
let notWrong=candidates.filter(v=>!state.wrong[v.w]);
notWrong.sort((a,b)=>(state.masteredCount[a.w]||0)-(state.masteredCount[b.w]||0));
let pool=wrong.length>0?wrong.concat(notWrong):notWrong;
practiceWord=pool[Math.floor(Math.random()*Math.min(pool.length,20))];
let html='<div class="practice-box">'+
'<p style="margin-bottom:16px;color:#888;font-size:.85rem">根据中文意思拼写英语单词</p>'+
'<div class="prompt">'+practiceWord.m+'</div>';
if(practiceWord.p)html+='<div class="phonetic-hint">'+practiceWord.p+'</div>';
html+='<button class="btn btn-outline" onclick="speak(\''+practiceWord.w.replace(/'/g,"\\'")+'\')" style="margin-bottom:16px">🔊 听发音</button>';
html+='<input type="text" id="spell-input" placeholder="在这里输入单词..." autocomplete="off" autocapitalize="off" onkeydown="if(event.key===\'Enter\')checkSpelling()">'+
'<div class="feedback" id="spell-feedback"></div>'+
'<div class="controls">'+
'<button class="btn btn-outline" onclick="showHint()">💡 提示</button>'+
'<button class="btn btn-primary" onclick="checkSpelling()">提交</button>'+
'<button class="btn btn-success" onclick="renderPractice()">下一个</button>'+
'</div>'+
'<p style="margin-top:16px;font-size:.8rem;color:#ccc">'+practiceWord.e+'</p>'+
'</div>';
document.getElementById('view-practice').innerHTML=html;
setTimeout(()=>document.getElementById('spell-input')?.focus(),100);
}
function checkSpelling(){
if(!practiceWord)return;
const input=document.getElementById('spell-input');
const feedback=document.getElementById('spell-feedback');
const val=input.value.trim().toLowerCase();
const correct=practiceWord.w.toLowerCase();
if(val===correct){
input.classList.add('correct');feedback.className='feedback show success';feedback.innerHTML='✅ 正确！'+practiceWord.e;
state.learned[practiceWord.w]=true;state.mastered[practiceWord.w]=true;delete state.wrong[practiceWord.w];
state.masteredCount[practiceWord.w]=(state.masteredCount[practiceWord.w]||0)+1;
if(!state.firstMasteredDate[practiceWord.w])state.firstMasteredDate[practiceWord.w]=new Date().toISOString();
// 退休由 checkRetiredStatus() 根据时间条件统一判断，不在此处立即退休
state.todayCorrect[getTodayStr()+'-'+practiceWord.w]=true;
state.lastReviewed[practiceWord.w]=new Date().toISOString();
state.stats.totalAnswered++;state.stats.correct++;
state.modeStats.practice.total=(state.modeStats.practice.total||0)+1;
state.modeStats.practice.correct=(state.modeStats.practice.correct||0)+1;
save();showConfetti();
}else{
input.classList.add('wrong');feedback.className='feedback show error';feedback.innerHTML='❌ 不对。正确答案：<strong>'+practiceWord.w+'</strong>';
state.wrong[practiceWord.w]=true;state.stats.totalAnswered++;delete state.todayCorrect[getTodayStr()+'-'+practiceWord.w];
state.lastReviewed[practiceWord.w]=new Date().toISOString();
state.modeStats.practice.total=(state.modeStats.practice.total||0)+1;
save()}
}
function showHint(){const input=document.getElementById('spell-input');if(input&&practiceWord){const w=practiceWord.w;let hint='';for(let i=0;i<w.length;i++){hint+=i<Math.ceil(w.length/2)?w[i]:'_'}input.value=hint;input.focus()}}
// Quiz mode
let quizQuestions=[],quizIdx=0,quizScore=0,quizAnswered=false;
function renderQuiz(){
quizQuestions=[];
// Only use words the child has already learned (including retired words for review)
const candidates=VOCAB.filter(v=>state.learned[v.w]&&v.w.length>0);
if(candidates.length<4){document.getElementById('view-quiz').innerHTML='<div class="empty-state"><div class="icon">📭</div><p>至少需要学过4个单词才能做题</p><div class="controls" style="margin-top:16px"><button class="btn btn-primary" onclick="showView(\'learn\')">去学单词</button></div></div>';return}
// Prioritize wrong words
let wrong=candidates.filter(v=>state.wrong[v.w]);
let notWrong=candidates.filter(v=>!state.wrong[v.w]);
let pool=wrong.length>0?wrong.concat(notWrong):candidates;
let shuffled=seededShuffle(pool,getPlanDay()*13+5);
for(let i=0;i<Math.min(10,shuffled.length);i++){
const w=shuffled[i];
if(quizQuestions.some(q=>q.word===w.w))continue;
const type='zh2en';
const options=[w];
const optPool=VOCAB.filter(v=>v.w!==w.w&&!v.w.includes('...'));
for(let j=0;j<3&&optPool.length>0;j++){const idx=Math.floor(Math.random()*optPool.length);if(!options.includes(optPool[idx]))options.push(optPool[idx]);optPool.splice(idx,1)}
options.sort(()=>Math.random()-0.5);
quizQuestions.push({word:w,type,options})
}
quizIdx=0;quizScore=0;renderQuizQuestion();
}
function renderQuizQuestion(){
if(quizIdx>=quizQuestions.length){showQuizResult();return}
quizAnswered=false;const q=quizQuestions[quizIdx];
let html='<div style="text-align:center;margin-bottom:12px"><span class="day-badge">第'+(quizIdx+1)+'/'+quizQuestions.length+'题</span></div>';
html+='<div class="quiz-question">';
if(q.type==='en2zh'){
html+='<div class="qtype-badge choice">英译中</div>';
html+='<div class="question-text">'+q.word.w+'</div>';
if(q.word.p)html+='<div style="text-align:center;color:#888;margin-bottom:16px">'+q.word.p+'</div>';
html+='<div style="text-align:center;margin-bottom:16px"><button class="btn btn-outline" onclick="speak(\''+q.word.w.replace(/'/g,"\\'")+'\')">🔊 听发音</button></div>';
html+='<div class="quiz-options">';
q.options.forEach((opt,i)=>{html+='<div class="quiz-option" onclick="answerQuiz('+i+')" data-idx="'+i+'">'+opt.m+'</div>'});
html+='</div>';
}else{
html+='<div class="qtype-badge choice">中译英</div>';
html+='<div class="question-text">'+q.word.m+'</div>';
if(q.word.p)html+='<div style="text-align:center;color:#888;margin-bottom:16px">'+q.word.p+'</div>';

function startExam(mode,unit){
examQuestions=[];let pool;
if(mode==='all'){pool=VOCAB.filter(v=>state.learned[v.w]||v.d<=getPlanDay())}
else if(mode==='unit'){pool=VOCAB.filter(v=>v.u===unit)}
if(pool.length<4){alert('该范围单词不足4个，无法出题。请先学习更多单词。');return}
const shuffled=[...pool].sort(()=>Math.random()-0.5);
for(let i=0;i<Math.min(20,shuffled.length);i++){
const w=shuffled[i];
const r=Math.random();
if(r<0.4&&!w.w.includes('...')&&!w.w.includes('/')){
examQuestions.push({type:'spell',word:w});
}else{
const options=[w];const p=VOCAB.filter(v=>v.w!==w.w);
for(let j=0;j<3&&p.length>0;){const idx=Math.floor(Math.random()*p.length);if(!options.includes(p[idx])){options.push(p[idx]);j++}p.splice(idx,1)}
options.sort(()=>Math.random()-0.5);
examQuestions.push({type:'choice',word:w,options,dir:Math.random()<0.5?'en2zh':'zh2en'})}
}

// ============= 智能合并函数 =============
function mergeStates(local,remote){
if(!remote||typeof remote!=='object')return local;
const merged={};
// 并集：任一设备有就算有
merged.learned=Object.assign({},local.learned||{},remote.learned||{});
// 并集：任一设备掌握就算掌握
merged.mastered=Object.assign({},local.mastered||{},remote.mastered||{});
// wrong：只在两边都没掌握时保留 wrong 状态
const allWords=new Set([...Object.keys(local.wrong||{}),...Object.keys(remote.wrong||{})]);
merged.wrong={};
allWords.forEach(w=>{
if(!merged.mastered[w]){
if(local.wrong&&local.wrong[w])merged.wrong[w]=true;
if(remote.wrong&&remote.wrong[w])merged.wrong[w]=true
}
});
// retired：并集
merged.retired=Object.assign({},local.retired||{},remote.retired||{});
// masteredCount：取较大值
const allCounts=new Set([...Object.keys(local.masteredCount||{}),...Object.keys(remote.masteredCount||{})]);
merged.masteredCount={};
allCounts.forEach(w=>{
const lc=(local.masteredCount&&local.masteredCount[w])||0;
const rc=(remote.masteredCount&&remote.masteredCount[w])||0;
merged.masteredCount[w]=Math.max(lc,rc)
});
// firstMasteredDate：取较早的日期
const allDates=new Set([...Object.keys(local.firstMasteredDate||{}),...Object.keys(remote.firstMasteredDate||{})]);
merged.firstMasteredDate={};
allDates.forEach(w=>{
const ld=(local.firstMasteredDate&&local.firstMasteredDate[w])||null;
const rd=(remote.firstMasteredDate&&remote.firstMasteredDate[w])||null;
if(ld&&rd)merged.firstMasteredDate[w]=ld<rd?ld:rd;
else merged.firstMasteredDate[w]=ld||rd
});
// todayCorrect：并集
merged.todayCorrect=Object.assign({},local.todayCorrect||{},remote.todayCorrect||{});
// lastReviewed：取较新的日期
const allLastReviewed=new Set([...Object.keys(local.lastReviewed||{}),...Object.keys(remote.lastReviewed||{})]);
merged.lastReviewed={};
allLastReviewed.forEach(w=>{
const ld=(local.lastReviewed&&local.lastReviewed[w])||null;
const rd=(remote.lastReviewed&&remote.lastReviewed[w])||null;
if(ld&&rd)merged.lastReviewed[w]=ld>rd?ld:rd;
else merged.lastReviewed[w]=ld||rd
});
// modeStats：累加
merged.modeStats={
learn:{total:(local.modeStats&&local.modeStats.learn&&local.modeStats.learn.total||0)+(remote.modeStats&&remote.modeStats.learn&&remote.modeStats.learn.total||0),correct:(local.modeStats&&local.modeStats.learn&&local.modeStats.learn.correct||0)+(remote.modeStats&&remote.modeStats.learn&&remote.modeStats.learn.correct||0)},
practice:{total:(local.modeStats&&local.modeStats.practice&&local.modeStats.practice.total||0)+(remote.modeStats&&remote.modeStats.practice&&remote.modeStats.practice.total||0),correct:(local.modeStats&&local.modeStats.practice&&local.modeStats.practice.correct||0)+(remote.modeStats&&remote.modeStats.practice&&remote.modeStats.practice.correct||0)},
quiz:{total:(local.modeStats&&local.modeStats.quiz&&local.modeStats.quiz.total||0)+(remote.modeStats&&remote.modeStats.quiz&&remote.modeStats.quiz.total||0),correct:(local.modeStats&&local.modeStats.quiz&&local.modeStats.quiz.correct||0)+(remote.modeStats&&remote.modeStats.quiz&&remote.modeStats.quiz.correct||0)}
};
// dayProgress：并集
merged.dayProgress=Object.assign({},local.dayProgress||{},remote.dayProgress||{});
// stats：totalAnswered/correct 取较大值，daysStudied 并集
const ls=local.stats||{totalAnswered:0,correct:0,daysStudied:[]};
const rs=remote.stats||{totalAnswered:0,correct:0,daysStudied:[]};
merged.stats={
totalAnswered:Math.max(ls.totalAnswered||0,rs.totalAnswered||0),
correct:Math.max(ls.correct||0,rs.correct||0),
daysStudied:Array.from(new Set([...(ls.daysStudied||[]),...(rs.daysStudied||[])]))
};
// recordingScores：按词合并数组，按 date 去重
const allRecWords=new Set([...Object.keys(local.recordingScores||{}),...Object.keys(remote.recordingScores||{})]);
merged.recordingScores={};
allRecWords.forEach(w=>{
const la=(local.recordingScores&&local.recordingScores[w])||[];
const ra=(remote.recordingScores&&remote.recordingScores[w])||[];
const seen=new Set();
const mergedArr=[];
[...la,...ra].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(r=>{
const key=r.date+'-'+r.score;
if(!seen.has(key)){seen.add(key);mergedArr.push(r)}
});
merged.recordingScores[w]=mergedArr
});
return merged
}

async function ghReadProgress(){

}
async function ghWriteProgress(progressData,sha){

return result.content.sha;
}

const CLOUD_BLOB_KEY='cloud_blob_id';
let cloudBlobId=localStorage.getItem(CLOUD_BLOB_KEY)||null;
let cloudTimer=null,cloudSyncing=false;
function cloudStatus(msg,type){
const icons={ok:'☁️',sync:'🔄',err:'⚠️',off:''};
const colors={ok:'#52c41a',sync:'#1890ff',err:'#ff4d4f',off:'#bbb'};

}
// Fetch with timeout — prevents hanging on slow/blocked networks
function fetchWithTimeout(url,options,timeoutMs){
const ms=timeoutMs||15000;
if(typeof AbortController==='undefined')return fetch(url,options);
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),ms);
return fetch(url,Object.assign({},options,{signal:controller.signal})).finally(()=>{clearTimeout(timer)})
}
async function cloudSave(){
if(cloudSyncing)return;
cloudSyncing=true;cloudStatus('同步中...','sync');
try{
if(cloudBlobId){
// Try to fetch remote for merging — but don't let GET failure block upload
let mergedOK=false;
try{
const getResp=await fetchWithTimeout('https://jsonblob.com/api/jsonBlob/'+cloudBlobId,{headers:{'Accept':'application/json'}});
if(getResp.status===404){
// Blob expired (24h limit) — create new one
cloudBlobId=null;localStorage.removeItem(CLOUD_BLOB_KEY);
cloudSyncing=false;return cloudSave()
}
if(getResp.ok){
const remote=await getResp.json();
if(remote&&typeof remote==='object'){
const m=mergeStates(state,remote);
state.learned=m.learned;state.mastered=m.mastered;
state.wrong=m.wrong;state.stats=m.stats;
state.dayProgress=m.dayProgress;state.recordingScores=m.recordingScores;
state.masteredCount=m.masteredCount;state.firstMasteredDate=m.firstMasteredDate;
state.retired=m.retired;state.todayCorrect=m.todayCorrect;
saveData(state);mergedOK=true
}
}
}catch(getErr){
// GET failed (timeout/network) — still upload local data without merge
}
// Upload (merged or local) data
const data=JSON.stringify(state);
const resp=await fetchWithTimeout('https://jsonblob.com/api/jsonBlob/'+cloudBlobId,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:data});
if(!resp.ok)throw new Error('PUT '+resp.status);
cloudStatus(mergedOK?'已同步':'已同步(仅本地)','ok');updateSyncUrl();
}else{
// First time: create new blob
const data=JSON.stringify(state);
const resp=await fetchWithTimeout('https://jsonblob.com/api/jsonBlob',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:data});
if(resp.ok){
const loc=resp.headers.get('Location')||'';
const xid=resp.headers.get('X-jsonblob-id')||'';
const id=xid||loc.split('/').pop();
if(id){cloudBlobId=id;localStorage.setItem(CLOUD_BLOB_KEY,id);cloudStatus('已同步','ok');updateSyncUrl()}
else throw new Error('No blob ID in response')
}
else throw new Error('POST '+resp.status);
}
}catch(e){
cloudStatus('同步失败','err');
// Retry once after 5s on network/timeout errors (not on 404 or expired)
if(!String(e.message).includes('404')&&!String(e.message).includes('No blob')){
setTimeout(()=>{if(!cloudSyncing)cloudSave()},5000)
}
}
cloudSyncing=false;
}

async function cloudLoad(){
if(!cloudBlobId)return false;
try{
const resp=await fetchWithTimeout('https://jsonblob.com/api/jsonBlob/'+cloudBlobId,{headers:{'Accept':'application/json'}});
if(resp.status===404){cloudBlobId=null;localStorage.removeItem(CLOUD_BLOB_KEY);cloudStatus('云端数据已过期','err');return'expired'}
if(!resp.ok){cloudStatus('云端读取失败','err');return'notfound'}
const remote=await resp.json();
if(!remote||typeof remote!=='object'){return'notfound'}
// 智能合并：不是整体替换，而是逐字段合并
const merged=mergeStates(state,remote);
state.learned=merged.learned;state.mastered=merged.mastered;
state.wrong=merged.wrong;state.stats=merged.stats;
state.dayProgress=merged.dayProgress;state.recordingScores=merged.recordingScores;
state.masteredCount=merged.masteredCount;state.firstMasteredDate=merged.firstMasteredDate;
state.retired=merged.retired;state.todayCorrect=merged.todayCorrect;
saveData(state);cloudStatus('已合并同步','ok');
return true;
}catch(e){
const errName=e.name||'';
if(errName==='AbortError'){cloudStatus('同步超时','err');return'timeout'}
cloudStatus('同步失败','err');return'network'
}
}
function scheduleCloudSync(){
if(cloudTimer)clearTimeout(cloudTimer);
cloudTimer=setTimeout(()=>{cloudSave()},2000);
}
// Confetti
function showConfetti(){for(let i=0;i<30;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#ff4d4f','#faad14','#52c41a','#4a90d9','#7b68ee'][Math.floor(Math.random()*5)];c.style.animationDelay=Math.random()*0.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}}
// Init
(async()=>{
const urlParams=new URLSearchParams(window.location.search);
const syncParam=urlParams.get('sync');
if(syncParam&&!cloudBlobId){cloudBlobId=syncParam;localStorage.setItem(CLOUD_BLOB_KEY,syncParam)}
const loaded=await cloudLoad();
checkRetiredStatus();
renderDashboard();
// Show sync failure feedback when opening sync link on new device
if(syncParam&&loaded!==true){
setTimeout(()=>{
if(loaded==='expired'){alert('⚠️ 云端数据已过期！\n\njsonblob.com 免费服务的数据24小时后自动删除。\n请回到原设备重新学习几个单词，系统会自动创建新的同步链接。')}
else if(loaded==='timeout'||loaded==='network'){alert('⚠️ 云端同步失败\n\n可能是网络问题，请检查网络后重试。')}
},500)
}
// 如果有本地学习数据，延迟后上传合并结果到云端
if(Object.keys(state.learned||{}).length>0){setTimeout(()=>{cloudSave()},3000)}
})();
renderDashboard();
</script>
